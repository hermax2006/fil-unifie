# Client statique (SPA) + proxy vers le serveur : une seule origine en prod.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # SPA : tout ce qui n'est pas un fichier existant retombe sur index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API + auth + webhooks + SSE + dashboard -> serveur Node
  location ~ ^/(api|auth|webhooks)(/|$) {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE (/api/stream) : pas de buffering, sinon les événements arrivent par paquets
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location /admin/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
